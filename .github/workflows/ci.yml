name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7 # ci.sh and some SETUP scripts use node
        with:
          node-version: 24
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ clang-format
      - run: bash ci.sh format clang-format
      - run: bash ci.sh build cpp
